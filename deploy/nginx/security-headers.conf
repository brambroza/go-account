# security headers ของหน้าเว็บ (include ในทุก location ของ SPA — add_header ใน location ทับของ server ทั้งชุด)
# API ใส่ header ของตัวเอง (CSP default-src 'none' ฯลฯ) — location /api/ จึงไม่ include ไฟล์นี้
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# emotion (MUI) ใส่ <style> ตอนรัน → style-src ต้องมี 'unsafe-inline'; script มาจาก bundle ของเราเท่านั้น; ไอคอน/ฟอนต์ฝังใน bundle
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security $ga_hsts always;
