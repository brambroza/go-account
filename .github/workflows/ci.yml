name: ci

# หน้าเว็บ: test (รวม golden/domain) → lint → typecheck → build → docker image (ไม่ push — push ทำใน deploy-staging ของ go-account-api หลังอนุมัติ)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --ci
      - run: yarn lint
      - run: npx tsc --noEmit
      - name: Build (api mode — แบบเดียวกับ image)
        run: yarn build
        env:
          VITE_DATA_MODE: api

  docker:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: go-account-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke the image (non-root, SPA fallback, headers)
        run: |
          docker run -d --name web -p 127.0.0.1:8080:8080 -e GA_API_UPSTREAM=http://127.0.0.1:9 -e GA_PUBLIC_SCHEME=https go-account-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(docker exec web id -u)" != "0"
          curl -fsS http://127.0.0.1:8080/some/deep/link | grep -q '<div id="root">'
          curl -sI http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -sI http://127.0.0.1:8080/ | grep -qi '^strict-transport-security: max-age='
          docker rm -f web
